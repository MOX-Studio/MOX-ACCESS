<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход · MOX ACCESS</title><link rel="icon" href="/favicon.svg"><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:24px 0;display:grid;place-items:center;background:#f5f6f8;color:#293247;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.card{width:min(420px,calc(100vw - 32px));padding:34px;background:#fff;border:1px solid #e4e8f0;border-radius:14px}.brand{font-size:21px;font-weight:750;margin-bottom:32px;letter-spacing:-.7px}h1{font-size:25px;font-weight:600;margin:0 0 12px}p{font-size:14px;line-height:1.7;color:#8792a4;margin:0 0 24px}label{font-size:14px;display:block;margin-bottom:9px;color:#55637a}input{width:100%;padding:12px;border:1px solid #dbe1ec;border-radius:7px;font:inherit;outline:none}input:focus{border-color:#345feb}button{width:100%;padding:13px;margin-top:21px;border:0;border-radius:7px;background:#345feb;color:#fff;font:inherit;font-weight:550;cursor:pointer}button:disabled{opacity:.5}.note{margin:22px 0 0;font-size:12px}.error{color:#b85d50;font-size:13px;line-height:1.6;margin-top:15px}@media(max-width:480px){.card{padding:26px 22px}.brand{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}h1{font-size:23px}}</style></head><body><main class="card"><div class="brand">MOX ACCESS</div><h1>Вход администратора</h1><p>Подписки, доступы сотрудников и фактический расход токенов.</p><form id="login-form"><label for="password">Пароль администратора</label><input id="password" type="password" autocomplete="current-password" autofocus required><div id="login-error" class="error" role="alert"></div><button type="submit">Войти</button></form><p class="note">Пароль создан при первом запуске сервера. Подписки OpenAI подключаются отдельно после входа.</p></main><script src="/login.js"></script></body></html>
